name = "flow-api"
main = "src/worker.js"
compatibility_date = "2026-08-27"

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "flow-api-v2"
database_id = "765244ed-bb23-45ec-afae-c221cfdbfa66"

[triggers]
crons = ["0 0 * * *"] # Run daily at midnight UTC
