name = "flow-api"
main = "src/worker.js"
compatibility_date = "2026-08-27"

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "api_logs_db"
database_id = "8aa848e7-5c9e-4d8d-a098-924f3eae1580"

[triggers]
crons = ["0 0 * * *"] # Run daily at midnight UTC
