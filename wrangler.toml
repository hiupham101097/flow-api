# NHANH DEMO - deploy len tai khoan huynhphuocdat2. KHONG merge vao main.
name = "flow-api-demo"
main = "src/worker.js"
compatibility_date = "2026-08-27"

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "flow-api-demo"
database_id = "226a020e-4123-4e3d-b128-970de2468765"

[triggers]
crons = ["0 0 * * *"] # Run daily at midnight UTC
